[workspace]
members = ["crates/ferrocade", "crates/ferrocade-py", "crates/ferrocade-web"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/pythonarcade/ferrocade"

[workspace.dependencies]
ferrocade = { path = "crates/ferrocade" }
wgpu = "30"
winit = "0.30"
pyo3 = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
web-time = "1.1"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
slotmap = "1.1"
smallvec = "1"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

# Image decoding and wgpu are painfully slow unoptimized; optimize dependencies in debug builds.
[profile.dev.package."*"]
opt-level = 2
