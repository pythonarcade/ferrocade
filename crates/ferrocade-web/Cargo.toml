[package]
name = "ferrocade-web"
description = "SPIKE: browser (wasm32-unknown-unknown) bindings for the Ferrocade engine (Phase 1b, approach B)"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ferrocade.workspace = true
wgpu.workspace = true
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CssStyleDeclaration", "Window", "Document", "console"] }
console_error_panic_hook = "0.1"
