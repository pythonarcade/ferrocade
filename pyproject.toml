[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ferrocade"
description = "A 2D game engine with a Python API and a Rust core"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment",
]

[project.urls]
Repository = "https://github.com/pythonarcade/ferrocade"

[tool.maturin]
manifest-path = "crates/ferrocade-py/Cargo.toml"
python-source = "python"
module-name = "ferrocade._ferrocade"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "display: needs a real display/GPU window (skipped when FERROCADE_HEADLESS=1)",
]
